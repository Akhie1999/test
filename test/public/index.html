<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React App</title>
    <!-- Cookiebot Script -->
    <script
      id="Cookiebot"
      src="https://consent.cookiebot.com/uc.js"
      data-cbid="64138b24-59cf-4e36-891f-cd08c83ba9f7"
      type="text/javascript"
      async
    ></script>

    <!-- Custom CSS for Cookiebot -->
    <style>
      /* Target the Cookiebot buttons */

      /* "Weigeren" button */
      #CybotCookiebotDialogBodyButtonDecline {
        border-color: #eb672a !important;
      }
      #CybotCookiebotDialogBodyLevelButtonLevelOptinAllowallSelection {
        border-color: #eb672a !important;
      }

      #CybotCookiebotDialogBodyLevelButtonLevelOptinAllowAll {
        background-color: #eb672a !important; /* Replace with your desired button background color */
        border-color: #eb672a !important;
      }

      /* Toggle switch styling */
      .CybotCookiebotDialogBodyLevelButtonSlider {
        background-color: gray !important;
      }

      /* Active toggle switch */
      input:checked + .CybotCookiebotDialogBodyLevelButtonSlider {
        background-color: #eb672a !important;
      }

      /* Toggle switch border when active */
      .CybotCookiebotDialogBodyLevelButtonSlider::before {
        border-color: #eb672a !important;
        color: #ff5733 !important;
      }
      /* Change the active tab underline color */
      /* Default style for the navigation links */

      /* Optional: Hover effect */
      /* Navigation container */
      #CybotCookiebotDialogNav {
        display: flex;
        border-bottom: 2px solid #e0e0e0; /* Light gray border */
        margin: 0;
        padding: 0;
        list-style: none;
      }

      /* Navigation links */
      #CybotCookiebotDialogNav a {
        text-decoration: none;
        padding: 12px 20px;
        font-size: 16px;
        font-weight: 500;
        color: #000; /* Default black text */
        position: relative;
        cursor: pointer;
        transition: color 0.3s ease;
      }

      /* Hover effect */
      #CybotCookiebotDialogNav a:hover {
        color: #ff5733; /* Orange on hover */
      }

      /* Focus effect for accessibility */
      #CybotCookiebotDialogNav a:focus {
        outline: none;
        color: #ff5733; /* Orange on focus */
        font-weight: bold;
      }

      /* Active tab styling */
      #CybotCookiebotDialogNav a.active {
        color: #ff5733; /* Orange for active tab */
        font-weight: bold;
      }

      /* Active underline */
      #CybotCookiebotDialogNav a.active::after,
      #CybotCookiebotDialogNav a:focus::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -2px;
        width: 100%;
        height: 3px;
        background-color: #ff5733; /* Orange underline */
      }

      /* Focus visible for accessibility */
      #CybotCookiebotDialogNav a:focus-visible {
        outline: 2px solid #ff5733; /* Orange focus ring */
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
